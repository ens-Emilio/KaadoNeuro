<!doctype html>

<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				var theme = 'light';
				try {
					var t = JSON.parse(localStorage.getItem('kaadoneuro_theme') || '"auto"');
					if (t === 'dark' || t === 'light') theme = t;
					else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
				} catch (e) {}
				document.documentElement.setAttribute('data-theme', theme);
				document.documentElement.style.colorScheme = theme;
			})();
		</script>
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2EFE9" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121316" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

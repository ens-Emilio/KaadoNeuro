<!doctype html>

<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />

		<!-- The static build has no server, so hooks.server.ts cannot set headers.
		     Keep this in sync with that policy; 'wasm-unsafe-eval' is what sql.js
		     needs to read .apkg collections. frame-ancestors is header-only and
		     therefore omitted here. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob:"
		/>
		<script>
			(function () {
				var theme = 'light';
				try {
					var t = JSON.parse(localStorage.getItem('kaadoneuro_theme') || '"auto"');
					if (t === 'dark' || t === 'light') theme = t;
					else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
				} catch (e) {}
				document.documentElement.setAttribute('data-theme', theme);
				document.documentElement.style.colorScheme = theme;
			})();
		</script>
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2EFE9" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121316" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
